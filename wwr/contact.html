<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Come&Raft - Contact Us</title>
    <meta name="description" content="This Contact Us page provides the Come&Raft company's contact information. This is also where clients can submit a form about their inquiries and feedbacks.">
    <meta name="author" content="Edgie Marielle Ambao">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Website Logo" width="100">
        <div id="logo">Come&Raft</div>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="company">Come&Raft</h1>
        <div class="contact-info">
            <p>098 Dandelion St., Los Angeles, California</p>
            <p>+63921123456</p>
            <p>come&raft@gmail.com</p>
        </div>

        <div class="info">
            
            <div class="map">
                <iframe
                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d8382.355397555888!2d120.63276883821095!3d14.070548465474097!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sph!4v1785157514780!5m2!1sen!2sph"
                width="400" height="380" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="form">
                <div class="column1">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder">
                </div>
                <div class="column1">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email" placeholder="Placeholder">
                </div>
                <div class="column1">
                    <label class="message-purpose">Message Purpose</label>
                    <div class="purpose">
                        <label class="purpose1"><input type="radio" id="purpose1" name="purpose">General Inquiry</label>
                        <label class="purpose2"><input type="radio" id="purpose2" name="purpose">Reservation Question</label>
                        <label class="purpose3"><input type="radio" id="purpose3" name="purpose">Website Suggestion</label>
                    </div>
                </div>
                <div class="message">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here"></textarea>
                </div>
                <div class="column1">
                    <label class="checkbox"><input type="checkbox" id="subscribe" name="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        
        
        <div class="employee">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-section">
                <figure class="employee-img">
                    <img src="images/employee1.png" alt="Employee 1" width="150"/>
                    <figcaption>Booking Coordinator</figcaption>
                </figure>
                <figure class="employee-img">
                    <img src="images/employee2.jpg" alt="Employee 2" width="150" />
                    <figcaption>Raft Guide</figcaption>
                </figure>
                <figure class="employee-img">
                    <img src="images/employee3.jpg" alt="Employee 3" width="150" />
                    <figcaption>Safety Kayaker</figcaption>
                </figure>
            </div>
        </div>
    </main>
    <footer>
        <p>©2026 🛶Come&Raft🛶 Edgie Marielle Ambao</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook logo" width="50">
            </a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.png" alt="Instagram Logo" width="50">
            </a>
            <a href="https://x.com/">
                <img src="images/threadslogo.png" alt="Threads logo" width="50">
            </a>    
        </nav>
    </footer>
</body>
</html>
